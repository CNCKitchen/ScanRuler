<!doctype html>

<html lang="en" data-design="measure">
  <head>
    <meta charset="UTF-8" />
    <!-- Page zoom remains available; the canvas owns its own gestures. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>ScanRuler by CNC Kitchen</title>
    <meta
      name="description"
      content="ScanRuler by CNC Kitchen — analyze 3D scans in your browser: fit spheres, cylinders and planes, measure dimensions, map deviation from CAD and wall thickness. Everything stays local."
    />
    <!-- The tab icon is the logo's mark, simplified for 16 px; the .ico is
         for browsers that take no SVG. The full logo set is in docs/brand. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48" />
    <style>
      /* Match the Measure shell before its stylesheet arrives. */
      html { background: #e9edf2; }
      html[data-theme='dark'] { background: #202833; }
    </style>
    <script>
      try {
        var t = localStorage.getItem('scanruler.uitheme')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
