# Serves the built app. Like the Cloudflare deployment (wrangler.jsonc), any
# path that is not a file gets index.html, which is what makes /s/<name>
# links work and turns a stale asset URL into a reload of the app.

# The same Content-Security-Policy as public/_headers, which explains each
# directive; keep the two alike. The worker scripts that load the CAD kernel
# or the mesh boolean generate their bindings with new Function, so only they
# get 'unsafe-eval'. A worker takes its policy from its own response; the page
# keeps the strict one.
map $uri $scanruler_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: data: blob: http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/assets/(re(Helper)?|mesh)Worker- "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 1k;

    # nginx drops the server's add_header lines in any location that has its
    # own, so each location below repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $scanruler_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed bundles never change under one name.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $scanruler_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy $scanruler_csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
