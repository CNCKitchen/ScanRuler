# Serve the built ScanRuler app. It is a single-page app, so unknown routes
# fall back to index.html rather than 404.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Keep nginx's default MIME map (mime.types maps .js -> application/javascript,
    # .wasm -> application/wasm, etc). Browsers reject ES modules served with the
    # wrong type, so this must stay. Do NOT add a bare `types { ... }` block here:
    # it replaces the whole map instead of extending it.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The app runs heavy geometry in Web Workers and WASM. gzip keeps the large
    # JS/WASM bundles small.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/wasm image/svg+xml font/woff2;

    # Hashed assets are immutable; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts are preloaded and stable.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve the file if it exists, else index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
