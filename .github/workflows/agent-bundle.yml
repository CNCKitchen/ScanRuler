# SPDX-License-Identifier: AGPL-3.0-only
# The agent server with ScanRuler running headless in it, bundled as a single executable plus its engine for every platform and architecture a GitHub-hosted runner offers (npm run bundle:agent), then started as an MCP client starts it and made to do real work (npm run smoke:agent). Each target is built on its own runner because the executable carries that runner's Node. Called by CI on every pull request, so a platform that cannot be bundled fails before a release, and by the release workflow, which passes the tag whose release the archives are attached to.
name: Agent bundle

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the archives to (empty keeps them as workflow artifacts only)
        type: string
        required: false
        default: ''

# No permissions block: a called workflow can only lower the caller's token, so declaring contents: read here would stop the release caller's contents: write reaching the upload step (HTTP 403).

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: win32-x64, runner: windows-latest }
          - { target: win32-arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix mcp ci
      - run: npm run bundle:agent
      - run: npm run smoke:agent
      - name: Check the target built is the target named
        shell: bash
        run: test -d "dist-agent/${{ matrix.target }}"
      - name: Archive
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          name="scanruler-agent-${TAG:-test}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "./dist-agent/${{ matrix.target }}/*"
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar -C "dist-agent/${{ matrix.target }}" -czf "$name.tar.gz" .
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7
      - name: Attach to the release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" "$ARCHIVE" --clobber
