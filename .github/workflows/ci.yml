# SPDX-License-Identifier: AGPL-3.0-only
# Test-and-build gate. Deployment itself lives on Cloudflare (Workers Builds
# watches this repo and runs its own build on push to main); this workflow is
# what keeps a red test suite visible on the PR before that happens.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
